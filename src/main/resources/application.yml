spring:
  application:
    name: apollo-elevators-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apollo}
    username: ${DB_USERNAME:apollo}
    password: ${DB_PASSWORD:apollo}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  master-key: ${APP_MASTER_KEY:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

logging:
  level:
    com.apollo.elevators: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha

  default-consumes-media-type: application/json
  default-produces-media-type: application/json
