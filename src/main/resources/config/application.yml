spring:
  application:
    name: apollo-elevators-backend
  profiles:
    default: neon

  datasource:
    url: jdbc:postgresql://ep-ancient-voice-azj0gtoq-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    username: neondb_owner
    password: npg_FU5hYwtveqo3
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9071

app:
  master-key: /RcKGbKF3Che8FLiKq6cuPcsmTPg4ZwKgIXh111eQzI=
  whatsapp:
    enabled: true
    base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com}
