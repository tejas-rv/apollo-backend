spring:
  application:
    name: apollo-elevator-backend

  # Secrets (DB_PASSWORD, MAIL_PASSWORD, APP_MASTER_KEY, ...) come from env vars or the git-ignored .env file
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/apollo-elevator-development}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:10MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tejas.v008@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
          timeout: ${MAIL_READ_TIMEOUT_MS:30000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:30000}

server:
  port: ${SERVER_PORT:9071}

app:
  master-key: ${APP_MASTER_KEY:}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:true}
    base-url: ${WHATSAPP_BASE_URL:https://graph.facebook.com}
    api-version: ${WHATSAPP_API_VERSION:v20.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
  email:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:tejas.v008@gmail.com}
    admin-recipients: ${EMAIL_ADMIN_RECIPIENTS:tejasv.1si18te052@gmail.com,tejas.rv@outlook.com}

logging:
  level:
    com.apollo.elevator: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    correlation: "[request:%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

apollo:
  seed:
    # true = create 10 sample customers (TEST-001..TEST-010) at startup if missing
    test-customers: ${SEED_TEST_CUSTOMERS:false}
  upi:
    vpa: ${UPI_VPA:tejas.v008@okaxis}
    payee-name: ${UPI_PAYEE_NAME:APOLLO ELEVATOR}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

google:
  drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:true}
    application-name: ${GOOGLE_DRIVE_APPLICATION_NAME:apollo-elevators}
    oauth-client-path: ${GOOGLE_DRIVE_OAUTH_CLIENT_PATH:D:/TVR/Projects/Apollo Elevators/apollo-elevator-oauth-client.json}
    token-directory: ${GOOGLE_DRIVE_TOKEN_DIRECTORY:D:/TVR/Projects/Apollo Elevators/google-drive-tokens}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:1dsvOfS87yLEa9RYBfYN5g5Ay85J0qGBa}
